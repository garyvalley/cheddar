# Hands a request to Nuxt; included by every location that proxies. A
# location that sets any proxy_set_header of its own stops inheriting the
# server's, so these are included rather than set once.

# $nuxt_upstream is a literal set once in the server block, never from the
# request, hence the narrow nosemgrep.
# nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host, generic.nginx.security.missing-internal.missing-internal
proxy_pass http://$nuxt_upstream;
# With its port: Nuxt's Origin check compares the browser's Origin, port and
# all, with this host (local runs are on :8085).
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
