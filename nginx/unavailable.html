<!DOCTYPE html>
<!--
  Served by nginx, with status 503 and Retry-After, while the app can't answer:
  Nuxt or PocketBase restarting during a deploy, for a few seconds. Static and
  script-free, so it needs nothing from the app it stands in for, and it
  reloads itself until the page it replaced is back.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="5">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Back in a moment · Cheddar</title>
  <style>
    :root { --ground: #f7f5f0; --card: #ffffff; --text: #1d1b16; --muted: #5c574b; --border: #dcd7cb; }
    @media (prefers-color-scheme: dark) {
      :root { --ground: #17150f; --card: #24211a; --text: #f3efe6; --muted: #c2bcae; --border: #3e392e; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: var(--ground);
      color: var(--text);
      font: 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 26rem;
      padding: 2rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.375rem; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Cheddar is updating</h1>
    <p role="status">This takes a few seconds. The page will reload by itself.</p>
  </main>
</body>
</html>
