# PocketBase for local development (pnpm run setup). Nuxt runs on the host
# with `pnpm dev`. Data stays in ./pb_data; the hooks are mounted, so editing
# pb_hooks/ reloads PocketBase.
services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    ports:
      # Loopback only: nothing else on the network reaches the dev database.
      - "127.0.0.1:${PB_HOST_PORT:-8095}:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks
    environment:
      APP_URL: http://localhost:${NUXT_DEV_PORT:-3005}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
      MAILJET_SENDER_EMAIL: ${MAILJET_SENDER_EMAIL:-}
      MAILJET_SENDER_NAME: ${MAILJET_SENDER_NAME:-Cheddar}
      # Bank linking through SimpleFIN (pb_hooks/bank_links.pb.js): off
      # without the key. `pnpm run setup` makes one.
      BANK_LINK_KEY: ${BANK_LINK_KEY:-}
      SIMPLEFIN_ALLOWED_ORIGINS: ${SIMPLEFIN_ALLOWED_ORIGINS:-}
      # The superuser scripts/migrate.mjs signs in with; PocketBase makes it
      # on start (scripts/pocketbase-start.sh).
      PB_SU_EMAIL: ${PB_SU_EMAIL:-}
      PB_SU_PASS: ${PB_SU_PASS:-}
    restart: unless-stopped

  # nginx as in the cluster, in front of Nuxt on this machine
  # (http://localhost:8085): the country block, the rate limits and the
  # holding page. `pnpm dev` serves :3005; for the production build on :3012
  # start it with NUXT_UPSTREAM=host.docker.internal:3012.
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-8085}:8080"
    environment:
      NUXT_UPSTREAM: ${NUXT_UPSTREAM:-host.docker.internal:3005}
      RESOLVER: 127.0.0.11
      # Local only: trusts any X-Forwarded-For, so the API suite can sign in
      # from a made-up address per test. The cluster trusts only the pod network.
      REAL_IP_FROM: 0.0.0.0/0
    restart: unless-stopped
