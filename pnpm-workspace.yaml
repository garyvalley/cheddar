packages: []

onlyBuiltDependencies:
  - esbuild

# Supply-chain guards: no git or tarball sub-dependencies, nothing published
# less than 7 days ago, and no package whose provenance got weaker.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Exceptions to trustPolicy, each a release that predates its line's
# provenance and is not a takeover.
trustPolicyExclude:
  # Published 2023-07, before npm provenance existed for the 6.x line; reaches
  # us through nuxt-security > unplugin-remove > @babel/core (build time only).
  - semver@6.3.1

# Advisories pnpm audit may pass over, each with why it can't reach production.
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (2026-11), no fixed release yet. Only build and dev
    # tooling uses it (nitropack, unstorage via devtools, eslint), on glob
    # patterns written in this repo; the production server doesn't ship it.
    # Drop this once a fixed picomatch is out. (G's OK, 2026-11-17.)
    - GHSA-fc5q-39xc-vjpf
